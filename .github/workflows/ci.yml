name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/radiology_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter and formatting check
        run: |
          npm run lint
          npm run format:check

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build
